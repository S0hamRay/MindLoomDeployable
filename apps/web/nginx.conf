server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defer DNS so nginx can start when Compose hostname "api" is absent (Railway).
    # Compose still proxies /api → api:8000. Railway should bake VITE_API_BASE to the
    # public API URL so the browser does not need this location.
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=on;
    resolver_timeout 5s;

    location /api/ {
        set $loom_api_upstream "http://api:8000";
        proxy_pass $loom_api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Always revalidate the shell so UI updates are not stuck behind browser cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Packaged macOS agent. Do not fall back to index.html if the zip is missing.
    location ^~ /downloads/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # React Router handles application routes in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
